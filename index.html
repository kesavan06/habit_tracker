<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productive - Habit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .date-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            color: white;
        }

        .date-nav button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .date-nav button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .current-date {
            font-size: 1.2em;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
            color: #333;
        }

        .main-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .add-habit-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .add-habit-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .add-habit-form input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .add-habit-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-habit-form select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: white;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .habits-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .habit-item:hover {
            background: #f0f0f0;
        }

        .habit-checkbox {
            width: 32px;
            height: 32px;
            border: 3px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .habit-checkbox.completed {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
        }

        .habit-checkbox.completed::after {
            content: '✓';
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .habit-info {
            flex: 1;
            margin-left: 15px;
        }

        .habit-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .habit-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #666;
        }

        .habit-streak {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .streak-flame {
            color: #ff6b6b;
        }

        .habit-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-health {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .category-productivity {
            background: #e3f2fd;
            color: #1565c0;
        }

        .category-fitness {
            background: #fff3e0;
            color: #e65100;
        }

        .category-mindfulness {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .category-social {
            background: #fce4ec;
            color: #c2185b;
        }

        .category-learning {
            background: #fff9c4;
            color: #f57f17;
        }

        .category-custom {
            background: #e0e0e0;
            color: #424242;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .add-habit-form {
                flex-direction: column;
            }

            .habit-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .habit-actions {
                margin-top: 10px;
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Productive</h1>
            <p>Build better habits, one day at a time</p>
        </div>

        <div class="date-nav">
            <button onclick="changeDate(-1)">← Previous</button>
            <div class="current-date" id="currentDate"></div>
            <button onclick="changeDate(1)">Next →</button>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <h3>Today's Progress</h3>
                <div class="value" id="todayProgress">0%</div>
            </div>
            <div class="stat-card">
                <h3>Current Streak</h3>
                <div class="value" id="currentStreak">0 🔥</div>
            </div>
            <div class="stat-card">
                <h3>Total Habits</h3>
                <div class="value" id="totalHabits">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed Today</h3>
                <div class="value" id="completedToday">0</div>
            </div>
        </div>

        <div class="main-content">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('today')">Today</button>
                <button class="tab-btn" onclick="switchTab('all')">All Habits</button>
                <button class="tab-btn" onclick="switchTab('stats')">Statistics</button>
            </div>

            <div id="todayTab" class="tab-content active">
                <div class="add-habit-section">
                    <h2 style="margin-bottom: 15px; color: #333;">Add New Habit</h2>
                    <div class="add-habit-form">
                        <input type="text" id="habitName" placeholder="Enter habit name..." />
                        <select id="habitCategory">
                            <option value="health">Health</option>
                            <option value="productivity">Productivity</option>
                            <option value="fitness">Fitness</option>
                            <option value="mindfulness">Mindfulness</option>
                            <option value="social">Social</option>
                            <option value="learning">Learning</option>
                            <option value="custom">Custom</option>
                        </select>
                        <button class="btn btn-primary" onclick="addHabit()">+ Add Habit</button>
                    </div>
                    <button class="btn" style="background: #f0f0f0; color: #333;" onclick="openAdvancedForm()">⚙️ Advanced Options</button>
                </div>

                <div id="habitsList" class="habits-list"></div>
            </div>

            <div id="allTab" class="tab-content">
                <div id="allHabitsList" class="habits-list"></div>
            </div>

            <div id="statsTab" class="tab-content">
                <div id="statsContent"></div>
            </div>
        </div>
    </div>

    <div id="advancedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Habit</h2>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <form id="advancedForm" onsubmit="addAdvancedHabit(event)">
                <div class="form-group">
                    <label>Habit Name</label>
                    <input type="text" id="advHabitName" required />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="advCategory">
                        <option value="health">Health</option>
                        <option value="productivity">Productivity</option>
                        <option value="fitness">Fitness</option>
                        <option value="mindfulness">Mindfulness</option>
                        <option value="social">Social</option>
                        <option value="learning">Learning</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea id="advDescription" placeholder="Why is this habit important to you?"></textarea>
                </div>
                <div class="form-group">
                    <label>Reminder Time (Optional)</label>
                    <input type="time" id="advReminderTime" />
                </div>
                <div class="form-group">
                    <label>Goal (Optional)</label>
                    <input type="text" id="advGoal" placeholder="e.g., 30 days streak" />
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Habit</button>
            </form>
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        let completions = JSON.parse(localStorage.getItem('completions')) || {};
        let currentDate = new Date();

        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function changeDate(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateUI();
        }

        function addHabit() {
            const name = document.getElementById('habitName').value.trim();
            const category = document.getElementById('habitCategory').value;

            if (!name) {
                alert('Please enter a habit name');
                return;
            }

            const habit = {
                id: Date.now().toString(),
                name,
                category,
                createdAt: new Date().toISOString(),
                description: '',
                reminderTime: null,
                goal: ''
            };

            habits.push(habit);
            saveData();
            document.getElementById('habitName').value = '';
            updateUI();
        }

        function openAdvancedForm() {
            document.getElementById('advancedModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('advancedModal').classList.remove('active');
        }

        function addAdvancedHabit(event) {
            event.preventDefault();

            const habit = {
                id: Date.now().toString(),
                name: document.getElementById('advHabitName').value.trim(),
                category: document.getElementById('advCategory').value,
                description: document.getElementById('advDescription').value.trim(),
                reminderTime: document.getElementById('advReminderTime').value || null,
                goal: document.getElementById('advGoal').value.trim(),
                createdAt: new Date().toISOString()
            };

            habits.push(habit);
            saveData();
            closeModal();
            document.getElementById('advancedForm').reset();
            updateUI();
        }

        function toggleHabit(habitId) {
            const dateKey = getDateKey(currentDate);
            
            if (!completions[habitId]) {
                completions[habitId] = [];
            }

            const index = completions[habitId].indexOf(dateKey);
            
            if (index > -1) {
                completions[habitId].splice(index, 1);
            } else {
                completions[habitId].push(dateKey);
            }

            saveData();
            updateUI();
        }

        function deleteHabit(habitId) {
            if (confirm('Are you sure you want to delete this habit?')) {
                habits = habits.filter(h => h.id !== habitId);
                delete completions[habitId];
                saveData();
                updateUI();
            }
        }

        function editHabit(habitId) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            document.getElementById('advHabitName').value = habit.name;
            document.getElementById('advCategory').value = habit.category;
            document.getElementById('advDescription').value = habit.description || '';
            document.getElementById('advReminderTime').value = habit.reminderTime || '';
            document.getElementById('advGoal').value = habit.goal || '';

            deleteHabit(habitId);
            openAdvancedForm();
        }

        function getStreak(habitId) {
            const completionDates = completions[habitId] || [];
            if (completionDates.length === 0) return 0;

            const sortedDates = completionDates.map(d => new Date(d)).sort((a, b) => b - a);
            let streak = 0;
            let checkDate = new Date();
            checkDate.setHours(0, 0, 0, 0);

            for (let i = 0; i < sortedDates.length; i++) {
                const completionDate = new Date(sortedDates[i]);
                completionDate.setHours(0, 0, 0, 0);

                const daysDiff = Math.floor((checkDate - completionDate) / (1000 * 60 * 60 * 24));

                if (daysDiff === streak) {
                    streak++;
                } else {
                    break;
                }
            }

            return streak;
        }

        function isCompletedOnDate(habitId, date) {
            const dateKey = getDateKey(date);
            return completions[habitId] && completions[habitId].includes(dateKey);
        }

        function renderHabits() {
            const dateKey = getDateKey(currentDate);
            const habitsList = document.getElementById('habitsList');
            
            if (habits.length === 0) {
                habitsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3>No habits yet</h3>
                        <p>Start building better habits by adding your first one above!</p>
                    </div>
                `;
                return;
            }

            habitsList.innerHTML = habits.map(habit => {
                const completed = isCompletedOnDate(habit.id, currentDate);
                const streak = getStreak(habit.id);
                const totalCompletions = completions[habit.id] ? completions[habit.id].length : 0;

                return `
                    <div class="habit-item">
                        <div class="habit-checkbox ${completed ? 'completed' : ''}" onclick="toggleHabit('${habit.id}')"></div>
                        <div class="habit-info">
                            <div class="habit-name">${habit.name}</div>
                            <div class="habit-meta">
                                <span class="category-badge category-${habit.category}">${habit.category}</span>
                                <span class="habit-streak">
                                    <span class="streak-flame">🔥</span> ${streak} day streak
                                </span>
                                <span>✓ ${totalCompletions} times</span>
                            </div>
                        </div>
                        <div class="habit-actions">
                            <button class="btn-icon" onclick="editHabit('${habit.id}')" title="Edit">✏️</button>
                            <button class="btn-icon" onclick="deleteHabit('${habit.id}')" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAllHabits() {
            const allHabitsList = document.getElementById('allHabitsList');
            
            if (habits.length === 0) {
                allHabitsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3>No habits yet</h3>
                        <p>Start building better habits by adding your first one!</p>
                    </div>
                `;
                return;
            }

            allHabitsList.innerHTML = habits.map(habit => {
                const streak = getStreak(habit.id);
                const totalCompletions = completions[habit.id] ? completions[habit.id].length : 0;
                const createdDate = new Date(habit.createdAt).toLocaleDateString();

                return `
                    <div class="habit-item">
                        <div class="habit-info" style="margin-left: 0;">
                            <div class="habit-name">${habit.name}</div>
                            <div class="habit-meta">
                                <span class="category-badge category-${habit.category}">${habit.category}</span>
                                <span class="habit-streak">
                                    <span class="streak-flame">🔥</span> ${streak} day streak
                                </span>
                                <span>✓ ${totalCompletions} completions</span>
                                <span>Created: ${createdDate}</span>
                            </div>
                            ${habit.description ? `<p style="margin-top: 8px; color: #666; font-size: 0.9em;">${habit.description}</p>` : ''}
                            ${habit.goal ? `<p style="margin-top: 4px; color: #667eea; font-size: 0.85em;">🎯 Goal: ${habit.goal}</p>` : ''}
                        </div>
                        <div class="habit-actions">
                            <button class="btn-icon" onclick="editHabit('${habit.id}')" title="Edit">✏️</button>
                            <button class="btn-icon" onclick="deleteHabit('${habit.id}')" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderStats() {
            const statsContent = document.getElementById('statsContent');
            
            if (habits.length === 0) {
                statsContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <h3>No statistics yet</h3>
                        <p>Complete some habits to see your statistics!</p>
                    </div>
                `;
                return;
            }

            const stats = habits.map(habit => {
                const streak = getStreak(habit.id);
                const totalCompletions = completions[habit.id] ? completions[habit.id].length : 0;
                const createdDate = new Date(habit.createdAt);
                const daysSinceCreation = Math.floor((new Date() - createdDate) / (1000 * 60 * 60 * 24)) + 1;
                const completionRate = daysSinceCreation > 0 ? Math.round((totalCompletions / daysSinceCreation) * 100) : 0;

                return {
                    habit,
                    streak,
                    totalCompletions,
                    completionRate,
                    daysSinceCreation
                };
            });

            stats.sort((a, b) => b.completionRate - a.completionRate);

            statsContent.innerHTML = `
                <h2 style="margin-bottom: 20px; color: #333;">Habit Performance</h2>
                ${stats.map(stat => `
                    <div class="habit-item" style="margin-bottom: 15px;">
                        <div class="habit-info" style="margin-left: 0; flex: 1;">
                            <div class="habit-name">${stat.habit.name}</div>
                            <div class="habit-meta">
                                <span class="category-badge category-${stat.habit.category}">${stat.habit.category}</span>
                                <span>🔥 ${stat.streak} day streak</span>
                                <span>✓ ${stat.totalCompletions}/${stat.daysSinceCreation} days</span>
                                <span style="color: ${stat.completionRate >= 80 ? '#2e7d32' : stat.completionRate >= 50 ? '#f57f17' : '#c2185b'}; font-weight: 600;">
                                    ${stat.completionRate}% completion rate
                                </span>
                            </div>
                            <div style="background: #e0e0e0; height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden;">
                                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100%; width: ${stat.completionRate}%; transition: width 0.3s;"></div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function updateStats() {
            const dateKey = getDateKey(currentDate);
            const todayHabits = habits.length;
            const completedHabits = habits.filter(h => isCompletedOnDate(h.id, currentDate)).length;
            const progress = todayHabits > 0 ? Math.round((completedHabits / todayHabits) * 100) : 0;
            
            const maxStreak = habits.length > 0 ? Math.max(...habits.map(h => getStreak(h.id))) : 0;

            document.getElementById('todayProgress').textContent = `${progress}%`;
            document.getElementById('currentStreak').textContent = `${maxStreak} 🔥`;
            document.getElementById('totalHabits').textContent = todayHabits;
            document.getElementById('completedToday').textContent = completedHabits;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');

            if (tab === 'today') {
                document.getElementById('todayTab').classList.add('active');
                renderHabits();
            } else if (tab === 'all') {
                document.getElementById('allTab').classList.add('active');
                renderAllHabits();
            } else if (tab === 'stats') {
                document.getElementById('statsTab').classList.add('active');
                renderStats();
            }
        }

        function saveData() {
            localStorage.setItem('habits', JSON.stringify(habits));
            localStorage.setItem('completions', JSON.stringify(completions));
        }

        function updateUI() {
            document.getElementById('currentDate').textContent = formatDate(currentDate);
            renderHabits();
            renderAllHabits();
            renderStats();
            updateStats();
        }

        // Initialize
        updateUI();

        // Handle Enter key for adding habits
        document.getElementById('habitName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addHabit();
            }
        });

        // Close modal on outside click
        document.getElementById('advancedModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
