<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProHabit | Minimalist Habit Tracker</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-success: #22c55e;
            --accent-danger: #ef4444;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-primary: #818cf8;
            --border-color: #334155;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: var(--transition);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Header & Controls */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-ghost { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-ghost:hover { background: var(--border-color); }

        /* Stats Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent-primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }

        /* Habit List */
        .habit-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .habit-info h3 { font-size: 1.1rem; margin-bottom: 0.2rem; }
        .habit-info p { font-size: 0.85rem; color: var(--text-muted); }

        .habit-actions { display: flex; gap: 0.8rem; align-items: center; }

        .check-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .check-btn.completed {
            background: var(--accent-success);
            border-color: var(--accent-success);
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
        }

        .danger-text { color: var(--accent-danger); cursor: pointer; font-size: 0.8rem; margin-top: 1rem; display: inline-block; }

        /* Responsive */
        @media (max-width: 600px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <header>
            <div>
                <h1>ProHabit</h1>
                <p id="current-date" style="color: var(--text-muted)"></p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-ghost" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
                <button class="btn btn-primary" onclick="openModal()">+ New Habit</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Active Habits</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-streak">0</div>
                <div class="stat-label">Best Streak</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-rate">0%</div>
                <div class="stat-label">Today's Score</div>
            </div>
        </div>

        <div id="habit-list">
            </div>

        <div style="margin-top: 3rem; display: flex; justify-content: center; gap: 1rem;">
            <button class="btn btn-ghost" onclick="exportData()">Export JSON</button>
            <button class="btn btn-ghost" onclick="importData()">Import JSON</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">Create Habit</h2>
            <form id="habit-form" style="margin-top: 1.5rem;">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Habit Name</label>
                    <input type="text" id="habit-name" placeholder="e.g. Read for 30 mins" required>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea id="habit-desc" rows="2"></textarea>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-ghost" style="flex: 1" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1">Save Habit</button>
                </div>
                <span id="delete-link" class="danger-text" style="display:none" onclick="deleteHabit()">Delete Habit</span>
            </form>
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        const today = new Date().toISOString().split('T')[0];

        // --- Core Functions ---
        
        function saveToStorage() {
            localStorage.setItem('habits', JSON.stringify(habits));
            render();
        }

        function render() {
            const list = document.getElementById('habit-list');
            const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('current-date').innerText = dateStr;

            list.innerHTML = habits.length === 0 
                ? `<p style="text-align:center; color: var(--text-muted); margin-top: 2rem;">No habits yet. Start by adding one!</p>`
                : '';

            habits.forEach(habit => {
                const isCompleted = habit.history.includes(today);
                const card = document.createElement('div');
                card.className = 'habit-card';
                card.innerHTML = `
                    <div class="habit-info" onclick="editHabit('${habit.id}')" style="cursor:pointer">
                        <h3>${habit.name}</h3>
                        <p>${habit.description || 'No description'}</p>
                        <small style="color: var(--accent-primary)">🔥 ${calculateStreak(habit)} day streak</small>
                    </div>
                    <div class="habit-actions">
                        <button class="check-btn ${isCompleted ? 'completed' : ''}" onclick="toggleHabit('${habit.id}')">
                            ${isCompleted ? '✓' : ''}
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });

            updateStats();
        }

        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            const index = habit.history.indexOf(today);
            if (index > -1) {
                habit.history.splice(index, 1);
            } else {
                habit.history.push(today);
            }
            saveToStorage();
        }

        // --- Stats Logic ---

        function calculateStreak(habit) {
            let streak = 0;
            let checkDate = new Date();
            const historySet = new Set(habit.history);

            while (true) {
                const dateStr = checkDate.toISOString().split('T')[0];
                if (historySet.has(dateStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function updateStats() {
            const total = habits.length;
            const completedToday = habits.filter(h => h.history.includes(today)).length;
            const rate = total === 0 ? 0 : Math.round((completedToday / total) * 100);
            const bestStreak = Math.max(...habits.map(h => calculateStreak(h)), 0);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-streak').innerText = bestStreak;
            document.getElementById('stat-rate').innerText = `${rate}%`;
        }

        // --- UI & Lifecycle ---

        const modal = document.getElementById('modal');
        const habitForm = document.getElementById('habit-form');

        function openModal() {
            modal.style.display = 'flex';
            document.getElementById('modal-title').innerText = 'Create Habit';
            document.getElementById('delete-link').style.display = 'none';
            habitForm.reset();
            document.getElementById('edit-id').value = '';
        }

        function closeModal() { modal.style.display = 'none'; }

        function editHabit(id) {
            const habit = habits.find(h => h.id === id);
            openModal();
            document.getElementById('modal-title').innerText = 'Edit Habit';
            document.getElementById('delete-link').style.display = 'inline-block';
            document.getElementById('edit-id').value = habit.id;
            document.getElementById('habit-name').value = habit.name;
            document.getElementById('habit-desc').value = habit.description;
        }

        function deleteHabit() {
            const id = document.getElementById('edit-id').value;
            if(confirm('Are you sure you want to delete this habit?')) {
                habits = habits.filter(h => h.id !== id);
                saveToStorage();
                closeModal();
            }
        }

        habitForm.onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('habit-name').value;
            const description = document.getElementById('habit-desc').value;

            if (id) {
                const habit = habits.find(h => h.id === id);
                habit.name = name;
                habit.description = description;
            } else {
                habits.push({
                    id: Date.now().toString(),
                    name,
                    description,
                    history: [],
                    createdAt: new Date().toISOString()
                });
            }
            saveToStorage();
            closeModal();
        };

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const newTheme = current === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // --- Data Portability ---

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(habits));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "habits_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            habits = imported;
                            saveToStorage();
                        }
                    } catch (err) { alert('Invalid file format'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Initialize
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        render();
    </script>
</body>
</html>
